spec_version: "0.1.0"
name: terraform-posture-sentinel
version: 1.0.0
description: Static ast parser for hashicorp hcl terraform configurations that blocks iam privilege escalations and unencrypted storage before commit.
author: "Rucha Salpure"
license: MIT
model:
  preferred: claude-opus-4-6
  fallback:
    - claude-sonnet-4-5-20250929
  constraints:
    temperature: 0.2
    max_tokens: 4096
skills:
  - hcl-ast-audit
tools: []
delegation:
  mode: auto
runtime:
  max_turns: 50
  timeout: 300
compliance:
  risk_tier: standard
  frameworks: []
tags:
  - devtools
  - autonomous-agent
  - opengap-verified
metadata:
  repository: "https://github.com/Rucha0901/terraform-posture-sentinel"
